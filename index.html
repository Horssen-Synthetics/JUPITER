function cloneObjLight(o){
  const c={};
  for(const k in o){
    const v=o[k];
    if(k==='geoPos'||k==='geoPal'||k==='geoPal0'||k==='geoTri'||k==='dataURL'||k==='tex'){ c[k]=v; }
    else if(Array.isArray(v)) c[k]=v.slice();
    else if(v && typeof v==='object') c[k]=JSON.parse(JSON.stringify(v));

  }
  return c;
}

function panCam(dx,dz){

}

function importImageFile(file){
  if(/\.gif$/i.test(file.name)||file.type==='image/gif'){ importGifFile(file); return; }
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxD=IMG_MAX; let w=img.width,h=img.height;
      if(w>maxD||h>maxD){ const s=maxD/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      impAdd('image',{tex:cv.toDataURL('image/jpeg',0.85),aspect:w/h,rot:[-Math.PI/2,0,0]},file.name);
    };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function importSoundFile(file){
  if(file.size>SND_HARD_LIMIT){
    alert('Ce fichier audio depasse '+(SND_HARD_LIMIT/1024/1024)+' Mo et ne peut pas etre importe (le fichier HTML final deviendrait trop lourd et instable). Utilise un extrait plus court ou un export mp3 plus compresse.');
    return;
  }
  if(file.size>SND_WARN){ alert('Ce fichier audio est volumineux ('+Math.round(file.size/1024/1024)+' Mo). Il sera integre tel quel dans le HTML final: un extrait court (10-30s) reste conseille pour la fluidite.'); }
  const r=new FileReader();
  r.onload=()=>{
    impAdd('sound',{name:file.name.replace(/\.[^.]+$/,''),dataURL:r.result,loop:true,localized:false,volume:70,reverb:'none',reverbAmt:50,delayAmt:0,distAmt:0,chorusAmt:0,flangerAmt:0},file.name);
  };
  r.onerror=()=>{ alert('Impossible de lire ce fichier audio. Reessaie avec un autre fichier .mp3 ou .wav.'); };
  r.readAsDataURL(file);
}

function disposeObj(root){
  root.traverse(function(c){
    if(c.isInstancedMesh && c.dispose) c.dispose();
    if(c.geometry && !(c.geometry.userData&&c.geometry.userData.shared)) c.geometry.dispose();
    if(c.material){ if(Array.isArray(c.material)) c.material.forEach(function(m){ m.dispose(); }); else { const mp=c.material.map; if(mp&&mp.userData&&mp.userData.ilc) mp.dispose(); c.material.dispose(); } }
  });
}
function liveRange(id,labelFn,apply){
  const el=document.getElementById(id); if(!el) return;
  const lab=el.previousElementSibling; let pending=false, last=0;
  el.oninput=function(e){
    last=+e.target.value; if(lab) lab.textContent=labelFn(last);
    if(pending) return; pending=true;
    requestAnimationFrame(function(){ pending=false; apply(last); });
  };
}

function uiCol(hex,a){ const h=/^#[0-9a-f]{6}$/i.test(hex||'')?hex:'#ffffff', n=parseInt(h.slice(1),16); return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+Math.max(0,Math.min(1,a))+')'; }
function uiPlace(el,it){ el.style.left=it.x+'%'; el.style.top=it.y+'%'; el.style.width=it.w+'%'; el.style.height=it.h+'%'; }
function uiStyle(el,it,fam,hov){
  const s=el.style, bgA=it.bgOff?0:(it.bgA!=null?+it.bgA:0)/100, txt=it.kind!=='box';
  uiPlace(el,it);
  s.borderRadius=(+it.rad||0)+'cqh'; s.opacity=(it.op!=null?+it.op:100)/100;
  const bg=hov&&it.hc?it.hc:it.bg;
  s.background=it.img&&!it.bgOff?'url("'+it.img+'") center/'+(it.fit==='cover'?'cover':'100% 100%')+' no-repeat':(bgA>0?uiCol(bg,bgA):'transparent');
  const sh=[], hg=hov?(+it.hg||0):0, hgc=it.hgc||'#ffffff';
  if(it.img&&!it.bgOff&&hov&&it.hc) sh.push('inset 0 0 0 100cqh '+uiCol(it.hc,0.35));
  s.boxShadow=sh.join(',');

function perfEstimate(){
  let tris=0, calls=0, lights=0, fires=0, chars=0, tex=0, illa=0; const skip={detector:1,damage:1,checkpoint:1,endDoor:1,timeline:1,refimage:1,tbmarker:1,sound:1,cam3d:1,player:1,group:1};
  project.objects.forEach(function(o){
    if(o.type==='light'){ lights++; return; } if(skip[o.type]) return; const m=meshes[o.id];
    if(o.type==='fire'||o.type==='water') fires++; if(o.textureURL) tex++;
    if(o.type==='chara'){ chars++; calls++; tris+=(m&&m.userData.tris)||6000; return; }
    if(o.type==='illus'){ calls++; tris+=2; const il=(project.illus||[]).find(function(x){ return x.id===o.illId; }); if(il&&illAnimated(il)) illa++; return; }
    if(m) m.traverse(function(c){ if(!c.isMesh||c.userData.icon) return; const g=c.geometry, pa=g&&g.attributes&&g.attributes.position; if(!pa) return; tris+=(g.index?g.index.count:pa.count)/3*(c.isInstancedMesh?c.count:1); calls++; });
  });
  const G=project.grading||{}, fx=(+G.tintAmount||0)||(+G.grain||0)||(+G.chroma||0)||(+G.glitch||0)||(+G.glitch2||0)||(+G.posterize||0)||(+G.vhs||0)||(+G.bloom||0)||(+G.lensFlare||0)||(+G.vignette||0)||(+G.pixelate||0)||(G.saturation!=null&&+G.saturation!==100)||(G.contrast!=null&&+G.contrast!==100)||((G.sharpBlur!=null?+G.sharpBlur:50)!==50)||(+G.vibrance||0)||(+G.shadowAmt||0)||(+G.midAmt||0)||(+G.hiAmt||0);
  const c=tris/2.5e6+calls/1500+lights*0.03+fires*0.02+chars*0.004+illa*0.008+(fx?0.08:0)+((+G.particleType>0)?(+G.particleAmt||0)/100*0.05:0)+tex*0.002;
  return c<=0.5?100:Math.max(1,Math.min(100,Math.round(100*Math.pow(0.5/c,0.8))));
}
